name: Bug Report
description: Create a report to help us improve Canary SRS
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure this report does not contain any sensitive worker data, private dataset samples, or secret tokens.
  - type: input
    id: version
    attributes:
      label: Canary Version
      description: What version of Canary SRS are you running? (e.g. 0.1.0 or git commit hash)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '/audit'
        2. Upload sample CSV
        3. Click 'Start Audit'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen according to Canary documentation and invariants.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant logs or terminal traces. Ensure all tokens are redacted.
      render: shell
