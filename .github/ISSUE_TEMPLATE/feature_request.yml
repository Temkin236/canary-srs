name: Feature Request
description: Suggest an idea or enhancement for Canary SRS
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify that your suggestion aligns with Canary's core invariants:
        - **Evidence, Not Verdict**: Canary provides explainable signals for human review, never automated cheating verdicts.
        - **No Automated Punishment**: Canary must never automatically penalize workers.
        - **Privacy First**: Respect worker privacy and data boundaries.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific challenge or dataset curation workflow?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
